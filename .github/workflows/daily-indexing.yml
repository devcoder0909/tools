name: Manual Search Discovery Notification

# Notifications normally run after deployment in deploy.yml.
# Manual recovery only: repeated unchanged submissions do not force indexing.
on:
  workflow_dispatch:

jobs:
  index:
    name: IndexNow Discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate sitemap URLs
        run: pnpm run build

      - name: Notify IndexNow after verifying the published key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm run indexing
