name: Verify Cloudflare release

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and verify production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Static Site
        run: pnpm run build

      # Cloudflare Workers Builds publishes main through its GitHub integration.
      - name: Verify published URLs after Cloudflare deployment
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm run seo:verify-live; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done
          exit 1

      - name: Save Live SEO Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-report
          path: .seo-reports/live-release.json
          if-no-files-found: ignore

      - name: Notify IndexNow of Published URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm run indexing
