<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-barcode-generator svg-desc-barcode-generator">
  <title id="svg-title-barcode-generator">Barcode Generator Online Workflow &amp; Architecture Diagram</title>
  <desc id="svg-desc-barcode-generator">Generating ISO/IEC compliant 1D and 2D barcodes with checksum validation and vector export in RAM.</desc>
  <defs>
    <linearGradient id="bgGrad-barcode-generator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow-barcode-generator" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad-barcode-generator)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="200" y="24" width="400" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" letter-spacing="0.5">
    1D/2D SYMBOLOGY & CHECK DIGIT CALCULATOR
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    How Standard Barcodes Render in Browser Memory
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">
    Code 128, EAN-13, UPC-A • Vector SVG & High-Res PNG • 100% Scannable
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 130)" filter="url(#shadow-barcode-generator)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">1</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Enter Code Data</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="105" text-anchor="middle" font-size="28">🏷️</text>
    <text x="105" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Alphanumeric or Digits</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Enter SKU, serial number, product ID</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Select symbology (Code 128, EAN)</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Set optional label text</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Instant barcode preview</text>
  </g>

  <!-- Flow 1 -->
  <g transform="translate(262, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(295, 130)" filter="url(#shadow-barcode-generator)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#eff6ff" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#2563eb">2</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Checksum Encoding</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="105" text-anchor="middle" font-size="28">📐</text>
    <text x="105" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Standard Pattern Map</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Calculate Modulo-103/10 checksum</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Insert start, stop, and quiet zones</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Draw exact black/white bar widths</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#eff6ff" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">ISO/IEC standardized</text>
  </g>

  <!-- Flow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#3b82f6" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 130)" filter="url(#shadow-barcode-generator)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#fdf2f8" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#db2777">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Download Vector / PNG</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="105" text-anchor="middle" font-size="28">💾</text>
    <text x="105" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Print-Ready Barcode</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Scalable vector SVG or PNG</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• High-contrast for laser scanners</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Ready for packaging & retail tags</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#fdf2f8" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#be185d">100% scannable output</text>
  </g>

  <!-- Bottom Privacy Banner -->
  <g transform="translate(180, 400)">
    <rect width="440" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="20" cy="14" r="5" fill="#10b981" />
    <text x="35" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">
      100% In-Browser Private Execution • Ephemeral Device RAM • Zero Server Uploads
    </text>
  </g>
</svg>