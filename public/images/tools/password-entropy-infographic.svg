<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="pwdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="pwdShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#pwdBg)" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <rect x="250" y="20" width="300" height="28" rx="14" fill="#4338ca" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
  <text x="400" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">
    NIST SP 800-63B CRYPTOGRAPHIC ENTROPY
  </text>
  <text x="400" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">
    Password Strength, Entropy &amp; Brute-Force Crack Time
  </text>
  <text x="400" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Information Theory: E = L × log₂(N) Across Length &amp; Character Pool Sizes
  </text>

  <!-- Left: Entropy Equation Box -->
  <g transform="translate(40, 118)" filter="url(#pwdShadow)">
    <rect width="325" height="295" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="14" width="28" height="28" rx="6" fill="#6366f1" fill-opacity="0.2" />
    <text x="30" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#818cf8">E</text>
    <text x="54" y="33" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Shannon Entropy Formula</text>

    <rect x="16" y="52" width="293" height="46" rx="6" fill="#090d16" stroke="#334155" />
    <text x="162" y="80" text-anchor="middle" font-family="monospace" font-size="16" font-weight="800" fill="#38bdf8">E = L × log₂(N)</text>

    <!-- Variable Breakdown -->
    <rect x="16" y="108" width="293" height="175" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Formula Components:</text>
    
    <text x="26" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• <tspan fill="#ffffff" font-weight="700">L = Length:</tspan> Total number of characters</text>
    <text x="26" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• <tspan fill="#ffffff" font-weight="700">N = Character Pool:</tspan></text>
    <text x="38" y="194" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc">- Lowercase (a-z): N = 26</text>
    <text x="38" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc">- Alphanumeric (a-z, A-Z, 0-9): N = 62</text>
    <text x="38" y="226" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc">- Full ASCII + Symbols (!@#$%): N = 95</text>
    
    <rect x="26" y="242" width="273" height="28" rx="4" fill="#065f46" />
    <text x="162" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">NIST Guideline: Target &gt;= 80 Bits Entropy</text>
  </g>

  <!-- Right: Brute Force Crack Times -->
  <g transform="translate(390, 118)" filter="url(#pwdShadow)">
    <rect width="370" height="295" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="14" width="28" height="28" rx="6" fill="#10b981" fill-opacity="0.2" />
    <text x="30" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#34d399">⏱</text>
    <text x="54" y="33" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Brute-Force Attack Resistance</text>

    <!-- Row 1: 8 Chars Lowercase (Catastrophic) -->
    <rect x="16" y="52" width="338" height="50" rx="6" fill="#090d16" stroke="#ef4444" stroke-opacity="0.5" />
    <text x="26" y="72" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ef4444">8 Chars (Lowercase Only)</text>
    <text x="26" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Entropy: 37.6 Bits • Combinations: 208 Billion</text>
    <text x="340" y="80" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ef4444">&lt; 0.01 Sec</text>

    <!-- Row 2: 12 Chars Alphanumeric (Moderate) -->
    <rect x="16" y="110" width="338" height="50" rx="6" fill="#090d16" stroke="#f59e0b" stroke-opacity="0.5" />
    <text x="26" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">12 Chars (Letters + Numbers)</text>
    <text x="26" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Entropy: 71.4 Bits • Combinations: 3.2 × 10²¹</text>
    <text x="340" y="138" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#fbbf24">2.4 Weeks</text>

    <!-- Row 3: 16 Chars Full Symbols (Strong) -->
    <rect x="16" y="168" width="338" height="50" rx="6" fill="#090d16" stroke="#10b981" stroke-opacity="0.5" />
    <text x="26" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">16 Chars (All Symbols + Numbers)</text>
    <text x="26" y="206" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Entropy: 105.1 Bits • Combinations: 4.4 × 10³¹</text>
    <text x="340" y="196" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#34d399">1.2B Years</text>

    <!-- Row 4: 20+ Chars Passphrase (Unbreakable) -->
    <rect x="16" y="226" width="338" height="50" rx="6" fill="#090d16" stroke="#6366f1" stroke-opacity="0.5" />
    <text x="26" y="246" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">20 Chars (Passphrase / Token)</text>
    <text x="26" y="264" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Entropy: 131.4 Bits • Cryptographically Infeasible</text>
    <text x="340" y="254" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#818cf8">Infinity</text>
  </g>
</svg>