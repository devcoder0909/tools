<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="sipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="sipShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#sipBg)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <rect x="250" y="24" width="300" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    SYSTEMATIC INVESTMENT PLAN (SIP)
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    Monthly Investment vs Long-Term Wealth Multiplier
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Example: $500 / Month at 12% Expected Annual Mutual Fund Return
  </text>

  <!-- 3 Milestones Grid -->
  <g transform="translate(45, 130)" filter="url(#sipShadow)">
    <rect width="220" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
