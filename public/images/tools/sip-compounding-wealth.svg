    <text x="60" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#334155">10 YEARS</text>

    <!-- Stack Bar -->
    <rect x="20" y="60" width="180" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="30" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Total Corpus Built</text>
    <text x="30" y="94" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#0f172a">$116,170</text>

    <text x="25" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Invested: $60,000</text>
    <text x="25" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#059669">• Returns: $56,170</text>
    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">• Wealth Multiplier: 1.9x</text>

    <rect x="20" y="215" width="180" height="20" rx="4" fill="#ecfdf5" />
    <text x="110" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#047857">Early Momentum Phase</text>
  </g>

  <g transform="translate(290, 130)" filter="url(#sipShadow)">
    <rect width="220" height="250" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <rect x="20" y="18" width="80" height="24" rx="6" fill="#10b981" />
    <text x="60" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">20 YEARS</text>

    <!-- Stack Bar -->
    <rect x="20" y="60" width="180" height="40" rx="6" fill="#ffffff" stroke="#a7f3d0" />
    <text x="30" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#047857">Total Corpus Built</text>
    <text x="30" y="94" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#059669">$499,574</text>

    <text x="25" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Invested: $120,000</text>
    <text x="25" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#059669">• Returns: $379,574</text>
    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">• Wealth Multiplier: 4.1x</text>

    <rect x="20" y="215" width="180" height="20" rx="4" fill="#059669" />
    <text x="110" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Interest Exceeds Principal 3x</text>
  </g>

  <g transform="translate(535, 130)" filter="url(#sipShadow)">
    <rect width="220" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="20" y="18" width="80" height="24" rx="6" fill="#f1f5f9" />
    <text x="60" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#334155">30 YEARS</text>

    <!-- Stack Bar -->
    <rect x="20" y="60" width="180" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="30" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Total Corpus Built</text>
    <text x="30" y="94" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#0f172a">$1,764,947</text>

    <text x="25" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Invested: $180,000</text>
    <text x="25" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#059669">• Returns: $1,584,947</text>
    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">• Wealth Multiplier: 9.8x</text>

    <rect x="20" y="215" width="180" height="20" rx="4" fill="#ecfdf5" />
    <text x="110" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Exponential Snowball</text>
