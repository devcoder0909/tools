<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e2e8f0"/>
      <rect x="8" width="8" height="8" fill="#f8fafc"/>
      <rect y="8" width="8" height="8" fill="#f8fafc"/>
      <rect x="8" y="8" width="8" height="8" fill="#e2e8f0"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>

  <!-- Header -->
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    IN-BROWSER BACKGROUND REMOVAL PIPELINE
  </text>
  <text x="400" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    Zero Server Uploads • Client-Side HTML5 Canvas Vector Alpha Masking
  </text>

  <!-- Step 1: Input -->
  <g transform="translate(60, 115)">
    <rect width="180" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="120" rx="8" fill="#334155"/>
    <circle cx="90" cy="65" r="28" fill="#f59e0b"/>
    <path d="M45 125 C65 95 85 105 105 125 Z" fill="#3b82f6"/>
    <text x="90" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">1. Original Image</text>
    <text x="90" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">JPG, PNG, WebP</text>
    <text x="90" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Solid/Cluttered BG</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 255 225 L 295 225" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <polygon points="295,221 305,225 295,229" fill="#10b981"/>

  <!-- Step 2: Processing Matrix -->
  <g transform="translate(310, 115)">
    <rect width="180" height="220" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="15" width="150" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981">Multi-Corner Chroma</text>
    <text x="90" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Euclidean RGB Dist</text>
    <text x="90" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#a78bfa">Tolerance Masking</text>
    <text x="90" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="#f43f5e">Edge Feathering</text>
    <text x="90" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">2. Canvas Engine</text>
    <text x="90" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">100% In-RAM Pixel Pass</text>
    <text x="90" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#10b981">0 External API Calls</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="505,221 515,225 505,229" fill="#10b981"/>

  <!-- Step 3: Transparent Output -->
  <g transform="translate(520, 115)">
    <rect width="180" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="120" rx="8" fill="url(#checker)"/>
    <circle cx="90" cy="65" r="28" fill="#f59e0b"/>
    <path d="M45 125 C65 95 85 105 105 125 Z" fill="#3b82f6"/>
    <text x="90" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">3. Transparent PNG</text>
    <text x="90" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">32-bit RGBA Cutout</text>
    <text x="90" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#10b981">Ready for Export</text>
  </g>

  <!-- Footer Banner -->
  <rect x="60" y="365" width="680" height="48" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
    Privacy Certified: Processing runs exclusively within device RAM via HTML5 Canvas API.
  </text>
</svg>
