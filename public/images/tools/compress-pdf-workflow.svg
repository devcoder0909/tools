<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="cpdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="cpdfCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="cpShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#cpdfBg)" stroke="#e2e8f0" stroke-width="2" />

  <rect x="270" y="24" width="260" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    CLIENT-SIDE COMPRESSION PIPELINE
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    How PDF File Size Reduction Works Locally
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Object Stream Optimization • Image Resampling • Structural Pruning in Device RAM
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 130)" filter="url(#cpShadow)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">1</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Large PDF File</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="105" y="98" text-anchor="middle" font-size="24">🐘</text>
    <text x="105" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">12.5 MB Original</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Scanned documents</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Exceeds portal caps</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Rejects in email send</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#fef2f2" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">Target: &lt; 200KB / 1MB</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(262, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(295, 130)" filter="url(#cpShadow)">
    <rect width="210" height="250" rx="12" fill="url(#cpdfCard)" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#10b981" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#065f46">Stream Compressor</text>

    <rect x="25" y="65" width="160" height="80" rx="8" fill="#ffffff" stroke="#a7f3d0" />
    <text x="105" y="98" text-anchor="middle" font-size="22">⚙️</text>
    <text x="105" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">Deflate Stream Re-encoding</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Downsample embedded images</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Strip unused font glyphs</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Purge obsolete metadata</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#059669" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Zero Quality Loss for Text</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 130)" filter="url(#cpShadow)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Lightweight Output</text>

    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#a7f3d0" />
    <text x="105" y="98" text-anchor="middle" font-size="24">⚡</text>
    <text x="105" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#059669">840 KB (-93.2%)</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Under portal upload limits</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Crystal clear readability</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Instant local download</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Ready for Visa &amp; Jobs</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(180, 402)">
    <rect width="440" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="24" cy="16" r="8" fill="#10b981" />
    <path d="M20 16 L23 19 L28 13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">
      Meets Strict Portal Limits: Easily shrink PDFs to 200KB, 500KB or 1MB budgets
    </text>
  </g>
</svg>
