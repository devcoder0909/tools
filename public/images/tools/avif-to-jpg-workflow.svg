<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-avif-to-jpg svg-desc-avif-to-jpg">
  <title id="svg-title-avif-to-jpg">AVIF to JPG Converter Workflow &amp; Architecture Diagram</title>
  <desc id="svg-desc-avif-to-jpg">Unpacking next-gen AV1 compressed stills into universal standard JPEG format in local RAM.</desc>
  <defs>
