    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Tone map to standard sRGB</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Flatten alpha to white</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#eff6ff" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">Zero cloud latency</text>
  </g>

  <!-- Flow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#3b82f6" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 130)" filter="url(#shadow-avif-to-jpg)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#fdf2f8" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#db2777">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Export JPEG File</text>
    
