<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-uuid svg-desc-uuid">
  <title id="svg-title-uuid">RFC 4122 UUID v4 Generation Architecture Diagram</title>
  <desc id="svg-desc-uuid">Cryptographic flowchart illustrating 128-bit entropy seeding, version/variant bitmasking, and canonical 36-character string output.</desc>
  <defs>
    <linearGradient id="bgGradUuid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadowUuid" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGradUuid)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="230" y="24" width="340" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    CRYPTOGRAPHIC RFC 4122 SPECIFICATION
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    How UUID Version 4 Generation Operates
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">
    122 Bits of Cryptographic Entropy • 3.4 × 10³⁸ Keyspace • In-Browser Web Cryptography API
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 130)" filter="url(#shadowUuid)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">1</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Entropy Harvest</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="100" text-anchor="middle" font-size="24">🎲</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">16 Cryptographic Bytes</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• crypto.getRandomValues()</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Hardware noise seeding</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Zero Math.random() bias</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">CSPRNG security grade</text>
  </g>

  <!-- Flow 1 -->
  <g transform="translate(262, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(295, 130)" filter="url(#shadowUuid)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">2</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Bitmask Clamping</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="100" text-anchor="middle" font-size="24">⚙️</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Version 4 &amp; Variant 1</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Byte 6: (b &amp; 0x0f) | 0x40</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Byte 8: (b &amp; 0x3f) | 0x80</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• RFC compliant bit markers</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">RFC 4122 Conformance</text>
  </g>

  <!-- Flow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 130)" filter="url(#shadowUuid)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Canonical UUID</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="100" text-anchor="middle" font-size="24">🔑</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">8-4-4-4-12 Hex String</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• 36 character standard string</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Upper &amp; lower case toggles</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Bulk batch generation</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Zero collision probability</text>
  </g>
</svg>