<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-photo-comp svg-desc-photo-comp">
  <title id="svg-title-photo-comp">Photo Compressor Architecture &amp; Compression Pipeline Diagram</title>
  <desc id="svg-desc-photo-comp">Flowchart illustrating client-side dynamic byte budget optimization in browser RAM with zero uploads.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2" />

  <rect x="270" y="24" width="260" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    CLIENT-SIDE COMPRESSION PIPELINE
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    How In-Browser Photo Compression Works
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">
    Binary Search Quantization • Target File Size Enforcement • Zero Cloud Uploads
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 130)" filter="url(#shadow)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">1</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Select Photo</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="100" text-anchor="middle" font-size="24">📸</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">DSLR or Phone Capture</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• 5MB – 25MB originals</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• JPG, PNG, WebP, HEIC</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Drag &amp; drop or Ctrl+V</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Read to local memory</text>
  </g>

  <!-- Flow 1 -->
  <g transform="translate(262, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(295, 130)" filter="url(#shadow)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#10b981" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Target Size Tuning</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" />
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d">Target: 20KB / 50KB / 100KB</text>
    <text x="105" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Dynamic Binary Search</text>
    <text x="105" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#047857">Canvas DCT Quantization</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Iterative quality search</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Chrominance subsampling</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Strip redundant EXIF</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#f0fdf4" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">Client CPU/GPU Canvas</text>
  </g>

  <!-- Flow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 130)" filter="url(#shadow)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Download &amp; Submit</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="100" text-anchor="middle" font-size="24">⚡</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Instant File Save</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Fits exact portal budget</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• No watermark stamped</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Zero server access log</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">100% Private Export</text>
  </g>
</svg>
