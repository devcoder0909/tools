<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-pdf-security-infographic-svg svg-desc-pdf-security-infographic-svg">
  <title id="svg-title-pdf-security-infographic-svg">Client-Side PDF Security & In-Memory Privacy Architecture</title>
  <desc id="svg-desc-pdf-security-infographic-svg">Diagram illustrating zero server uploads, local browser RAM processing, and instant document destruction.</desc>
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="safeBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="unsafeBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef2f2" />
    </linearGradient>
    <filter id="secShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#secBg)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <rect x="270" y="24" width="260" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    PDF PRIVACY &amp; SECURITY BENCHMARK
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    Best Converter (Client RAM) vs Traditional Cloud Converters
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Why enterprises and privacy-conscious users refuse to upload PDFs to external servers
  </text>

  <!-- Left: Best Converter (Safe) -->
  <g transform="translate(45, 125)" filter="url(#secShadow)">
    <rect width="330" height="260" rx="12" fill="url(#safeBox)" stroke="#10b981" stroke-width="2" />
    <rect x="20" y="20" width="130" height="28" rx="6" fill="#10b981" />
    <text x="85" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">BEST CONVERTER</text>
    <text x="165" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#047857">100% In-Browser RAM</text>

    <!-- Key Metrics -->
    <rect x="20" y="65" width="290" height="45" rx="8" fill="#ffffff" stroke="#a7f3d0" />
    <text x="35" y="87" font-family="system-ui, sans-serif" font-size="11" fill="#047857">Network Data Transmission</text>
    <text x="35" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#059669">0 Bytes (Zero Uploads)</text>
    <text x="245" y="94" font-family="system-ui, sans-serif" font-size="18">🛡️</text>

    <text x="25" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">✓ Documents Stored:</text>
    <text x="160" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#047857">Never stored (RAM only)</text>

    <text x="25" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">✓ Confidential Scans:</text>
    <text x="160" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#047857">Taxes, contracts, IDs safe</text>

    <text x="25" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">✓ File Size Caps:</text>
    <text x="160" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#047857">Unlimited (device RAM)</text>

    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">✓ Queue Delay:</text>
    <text x="160" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#047857">0 ms (Instant processing)</text>

    <rect x="20" y="225" width="290" height="24" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="165" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">GDPR &amp; HIPAA Safe • Zero Data Retention</text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(385, 240)">
    <circle cx="15" cy="15" r="22" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
    <text x="15" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">VS</text>
  </g>

  <!-- Right: Traditional Cloud Converters -->
  <g transform="translate(425, 125)" filter="url(#secShadow)">
    <rect width="330" height="260" rx="12" fill="url(#unsafeBox)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="20" y="20" width="130" height="28" rx="6" fill="#64748b" />
    <text x="85" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">CLOUD SERVICES</text>
    <text x="165" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Remote Servers</text>

    <!-- Key Metrics -->
    <rect x="20" y="65" width="290" height="45" rx="8" fill="#ffffff" stroke="#fecaca" />
    <text x="35" y="87" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">Network Data Transmission</text>
    <text x="35" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#dc2626">100% Uploaded to Cloud</text>
    <text x="245" y="94" font-family="system-ui, sans-serif" font-size="18">⚠️</text>

    <text x="25" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">✕ Documents Stored:</text>
    <text x="160" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">1 to 24 hours on cloud disks</text>

    <text x="25" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">✕ Confidential Scans:</text>
    <text x="160" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">High data breach risk</text>

    <text x="25" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">✕ File Size Caps:</text>
    <text x="160" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Capped at 15 MB - 50 MB</text>

    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">✕ Queue Delay:</text>
    <text x="160" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Slow upload / download waits</text>

    <rect x="20" y="225" width="290" height="24" rx="6" fill="#fef2f2" stroke="#fecaca" />
    <text x="165" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Artificial Paywalls &amp; Hourly Limits</text>
  </g>

  <!-- Footer Tip -->
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
    Security Policy: Best Converter never logs, inspects, or transmits document content across the web.
  </text>
</svg>
