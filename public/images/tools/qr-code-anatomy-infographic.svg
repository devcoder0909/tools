<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="qrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="qrShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#qrBg)" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <rect x="250" y="20" width="300" height="28" rx="14" fill="#0d9488" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1" />
  <text x="400" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf" letter-spacing="0.5">
    ISO/IEC 18004 STANDARD MATRIX
  </text>
  <text x="400" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">
    Anatomy of a Quick Response (QR) Code
  </text>
  <text x="400" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Finder Patterns, Timing Tracks, Alignment Modules &amp; Reed-Solomon Error Correction
  </text>

  <!-- Left: Visual QR Schematic Mockup -->
  <g transform="translate(50, 120)" filter="url(#qrShadow)">
    <rect width="280" height="280" rx="16" fill="#ffffff" />
    
    <!-- Quiet Zone Marker -->
    <rect x="10" y="10" width="260" height="260" fill="none" stroke="#e2e8f0" stroke-dasharray="4 4" stroke-width="1.5" />
    
    <!-- Top-Left Finder Pattern (7x7 modules) -->
    <rect x="24" y="24" width="60" height="60" rx="4" fill="#0f172a" />
    <rect x="32" y="32" width="44" height="44" rx="2" fill="#ffffff" />
    <rect x="40" y="40" width="28" height="28" rx="2" fill="#0f172a" />

    <!-- Top-Right Finder Pattern -->
    <rect x="196" y="24" width="60" height="60" rx="4" fill="#0f172a" />
    <rect x="204" y="32" width="44" height="44" rx="2" fill="#ffffff" />
    <rect x="212" y="40" width="28" height="28" rx="2" fill="#0f172a" />

    <!-- Bottom-Left Finder Pattern -->
    <rect x="24" y="196" width="60" height="60" rx="4" fill="#0f172a" />
    <rect x="32" y="204" width="44" height="44" rx="2" fill="#ffffff" />
    <rect x="40" y="212" width="28" height="28" rx="2" fill="#0f172a" />

    <!-- Timing Patterns -->
    <line x1="88" y1="54" x2="192" y2="54" stroke="#0f172a" stroke-width="4" stroke-dasharray="6 6" />
    <line x1="54" y1="88" x2="54" y2="192" stroke="#0f172a" stroke-width="4" stroke-dasharray="6 6" />

    <!-- Alignment Pattern (Small square bottom-right) -->
    <rect x="180" y="180" width="36" height="36" rx="2" fill="#14b8a6" />
    <rect x="186" y="186" width="24" height="24" rx="1" fill="#ffffff" />
    <rect x="192" y="192" width="12" height="12" rx="1" fill="#14b8a6" />

    <!-- Mock Data Bits -->
    <rect x="96" y="70" width="12" height="12" fill="#0f172a" />
    <rect x="114" y="86" width="12" height="12" fill="#0f172a" />
    <rect x="132" y="70" width="12" height="12" fill="#0f172a" />
    <rect x="150" y="98" width="12" height="12" fill="#0f172a" />
    <rect x="168" y="114" width="12" height="12" fill="#0f172a" />
    <rect x="96" y="130" width="12" height="12" fill="#0f172a" />
    <rect x="114" y="146" width="12" height="12" fill="#0f172a" />
    <rect x="132" y="162" width="12" height="12" fill="#0f172a" />
    <rect x="150" y="146" width="12" height="12" fill="#0f172a" />
    <rect x="114" y="210" width="12" height="12" fill="#0f172a" />
    <rect x="132" y="226" width="12" height="12" fill="#0f172a" />
    <rect x="150" y="210" width="12" height="12" fill="#0f172a" />
  </g>

  <!-- Right: Structural Element Explanations -->
  <g transform="translate(365, 120)">
    <!-- Item 1: Finder Patterns -->
    <rect width="385" height="62" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="22" cy="31" r="8" fill="#38bdf8" />
    <text x="40" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">3 Finder Position Patterns (7×7)</text>
    <text x="40" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Allows smartphone cameras to detect orientation at any 360° angle</text>

    <!-- Item 2: Timing Patterns -->
    <rect y="72" width="385" height="62" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="22" cy="103" r="8" fill="#fbbf24" />
    <text x="40" y="97" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Alternating Timing Tracks</text>
    <text x="40" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Synchronizes module grid coordinates across rows and columns</text>

    <!-- Item 3: Alignment Pattern -->
    <rect y="144" width="385" height="62" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="22" cy="175" r="8" fill="#2dd4bf" />
    <text x="40" y="169" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Alignment &amp; Distortion Correction</text>
    <text x="40" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Compensates for curved physical surfaces and perspective skew</text>

    <!-- Item 4: Error Correction Levels -->
    <rect y="216" width="385" height="66" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="22" cy="249" r="8" fill="#a78bfa" />
    <text x="40" y="241" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Reed-Solomon Error Correction</text>
    <text x="40" y="260" font-family="system-ui, sans-serif" font-size="11" fill="#a5b4fc">Level L: 7% • Level M: 15% • Level Q: 25% • Level H: 30% restoration</text>
  </g>
</svg>