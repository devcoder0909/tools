<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Video Background Canvas -->
  <rect width="1280" height="720" fill="url(#vidBg)" />

  <!-- Grid overlay -->
  <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />
  <path d="M213 0 V720 M426 0 V720 M640 0 V720 M853 0 V720 M1066 0 V720" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />

  <!-- Top Brand / Badge -->
  <rect x="80" y="60" width="180" height="36" rx="18" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <text x="170" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">
    BEST CONVERTER
  </text>

  <rect x="280" y="60" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
  <text x="360" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
    100% PRIVATE
  </text>

  <!-- Video Title -->
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff">
    How to Convert PNG to JPG
  </text>
  <text x="80" y="260" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#34d399">
    Without Losing Quality &amp; Zero Server Uploads
  </text>
  <text x="80" y="310" font-family="system-ui, sans-serif" font-size="20" fill="#cbd5e1">
    Adjust Quality • Batch Conversion • Download All as ZIP in 3 Simple Steps
  </text>

  <!-- Central Play Button -->
  <g transform="translate(640, 440)" filter="url(#glow)">
    <circle cx="0" cy="0" r="54" fill="url(#playGrad)" stroke="#ffffff" stroke-width="3" />
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff" />
  </g>

  <!-- Duration Badge -->
  <rect x="1120" y="640" width="80" height="34" rx="8" fill="#000000" fill-opacity="0.8" />
  <text x="1160" y="663" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
    1:15
  </text>

  <!-- Step Pills at Bottom -->
  <g transform="translate(80, 630)">
    <rect width="280" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="23" r="14" fill="#10b981" />
    <text x="28" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <text x="56" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Drop PNG or Paste (Ctrl+V)</text>
  </g>

  <g transform="translate(380, 630)">
    <rect width="280" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="23" r="14" fill="#10b981" />
    <text x="28" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">2</text>
    <text x="56" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Set 85% Quality Slider</text>
  </g>

  <g transform="translate(680, 630)">
    <rect width="280" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="23" r="14" fill="#10b981" />
    <text x="28" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">3</text>
    <text x="56" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Instant Download / ZIP</text>
  </g>
</svg>
