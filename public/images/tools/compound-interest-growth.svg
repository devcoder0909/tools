<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-compound-interest-growth-svg svg-desc-compound-interest-growth-svg">
  <title id="svg-title-compound-interest-growth-svg">Compound Interest Future Value & Exponential Wealth Curve Infographic</title>
  <desc id="svg-desc-compound-interest-growth-svg">Visual comparison of linear principal accumulation vs exponential compound interest returns across different compounding frequencies.</desc>
  <defs>
    <linearGradient id="ciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="ciShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#ciBg)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <rect x="260" y="24" width="280" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    EXPONENTIAL WEALTH ACCUMULATION
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    The Power of Compound Interest &amp; Rule of 72
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Principal Baseline vs Simple Linear Return vs Exponential Compounding Growth
  </text>

  <!-- Left: Visual Graph Container -->
  <g transform="translate(45, 130)" filter="url(#ciShadow)">
    <rect width="450" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Y Axis Labels -->
    <text x="25" y="45" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">$100k</text>
    <text x="25" y="95" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">$50k</text>
    <text x="25" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">$25k</text>
    <text x="25" y="195" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">$10k</text>

    <!-- Grid lines -->
    <path d="M60 40 H420 M60 90 H420 M60 140 H420 M60 190 H420" stroke="#f1f5f9" stroke-width="1" />

    <!-- X Axis Line -->
    <path d="M60 190 H420" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="65" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Year 0</text>
    <text x="145" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Year 5</text>
    <text x="225" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Year 10</text>
    <text x="305" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Year 15</text>
    <text x="385" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Year 20</text>

    <!-- 1. Principal Base Line ($10k constant) -->
    <path d="M65 190 H415" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- 2. Simple Interest Line (Linear) -->
    <path d="M65 190 L415 130" stroke="#3b82f6" stroke-width="2.5" />

    <!-- 3. Compound Interest Curve (Exponential) -->
    <path d="M65 190 Q225 150 415 45" stroke="#10b981" stroke-width="3.5" />
    <circle cx="415" cy="45" r="5" fill="#10b981" />
    <rect x="330" y="25" width="80" height="20" rx="4" fill="#10b981" />
    <text x="370" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">$100,626</text>

    <!-- Legend -->
    <g transform="translate(65, 225)">
      <rect x="0" y="0" width="12" height="4" rx="2" fill="#10b981" />
      <text x="18" y="5" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#047857">Compound (12%)</text>

      <rect x="130" y="0" width="12" height="4" rx="2" fill="#3b82f6" />
      <text x="148" y="5" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#2563eb">Simple (12%)</text>

      <rect x="250" y="0" width="12" height="4" rx="2" fill="#94a3b8" />
      <text x="268" y="5" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Principal Baseline</text>
    </g>
  </g>

  <!-- Right: Rule of 72 & Takeaways -->
  <g transform="translate(515, 130)" filter="url(#ciShadow)">
    <rect width="240" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <rect x="20" y="20" width="200" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="30" y="37" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#047857">⚡ The "Rule of 72":</text>
    <text x="30" y="53" font-family="system-ui, sans-serif" font-size="10" fill="#065f46">Years to Double = 72 ÷ Return Rate</text>

    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Doubling Timelines:</text>
    
    <rect x="20" y="95" width="200" height="32" rx="6" fill="#f8fafc" />
    <text x="30" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• At 6% Return: Doubles in <strong>12 Yrs</strong></text>

    <rect x="20" y="132" width="200" height="32" rx="6" fill="#f8fafc" />
    <text x="30" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• At 10% Return: Doubles in <strong>7.2 Yrs</strong></text>

    <rect x="20" y="169" width="200" height="32" rx="6" fill="#f8fafc" />
    <text x="30" y="189" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• At 12% Return: Doubles in <strong>6 Yrs</strong></text>

    <rect x="20" y="208" width="200" height="26" rx="4" fill="#059669" />
    <text x="120" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">A = P × (1 + r/n)^(nt)</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(180, 402)">
    <rect width="440" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="24" cy="16" r="8" fill="#10b981" />
    <path d="M20 16 L23 19 L28 13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">
      Frequent Compounding Advantage: Daily &gt; Monthly &gt; Quarterly &gt; Annual
    </text>
  </g>
</svg>
