<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="b64Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="b64Shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#b64Bg)" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <rect x="250" y="20" width="300" height="28" rx="14" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
  <text x="400" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">
    RFC 4648 BINARY-TO-TEXT RADIX-64
  </text>
  <text x="400" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff">
    How Base64 Encoding &amp; Decoding Work
  </text>
  <text x="400" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Converting 3 Raw 8-Bit Bytes (24 Bits) into 4 Printable 6-Bit ASCII Characters
  </text>

  <!-- Step 1: Input String -->
  <g transform="translate(40, 115)">
    <rect width="720" height="60" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="20" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">Raw ASCII Input (3 Bytes):</text>
    
    <rect x="230" y="14" width="80" height="32" rx="6" fill="#312e81" stroke="#6366f1" />
    <text x="270" y="35" text-anchor="middle" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff">'M'</text>
    
    <rect x="330" y="14" width="80" height="32" rx="6" fill="#312e81" stroke="#6366f1" />
    <text x="370" y="35" text-anchor="middle" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff">'a'</text>
    
    <rect x="430" y="14" width="80" height="32" rx="6" fill="#312e81" stroke="#6366f1" />
    <text x="470" y="35" text-anchor="middle" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff">'n'</text>

    <text x="540" y="35" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">Total: 3 × 8 = 24 bits</text>
  </g>

  <!-- Step 2: Binary Bitstream -->
  <g transform="translate(40, 185)">
    <rect width="720" height="68" rx="10" fill="#090d16" stroke="#334155" />
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">8-Bit Octets:</text>
    <text x="120" y="28" font-family="monospace" font-size="13" fill="#38bdf8">01001101 (77)</text>
    <text x="320" y="28" font-family="monospace" font-size="13" fill="#38bdf8">01100001 (97)</text>
    <text x="520" y="28" font-family="monospace" font-size="13" fill="#38bdf8">01101110 (110)</text>

    <line x1="20" y1="36" x2="700" y2="36" stroke="#1e293b" stroke-width="1" />

    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8">Split into 4 × 6-Bits:</text>
    <text x="150" y="55" font-family="monospace" font-size="13" font-weight="700" fill="#a78bfa">010011</text>
    <text x="290" y="55" font-family="monospace" font-size="13" font-weight="700" fill="#a78bfa">010110</text>
    <text x="430" y="55" font-family="monospace" font-size="13" font-weight="700" fill="#a78bfa">000101</text>
    <text x="570" y="55" font-family="monospace" font-size="13" font-weight="700" fill="#a78bfa">101110</text>
  </g>

  <!-- Step 3: Base64 Index & Output -->
  <g transform="translate(40, 263)">
    <rect width="720" height="75" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">Base64 Table Index:</text>
    <text x="175" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Index 19</text>
    <text x="315" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Index 22</text>
    <text x="455" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Index 5</text>
    <text x="595" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Index 46</text>

    <!-- 4 Character Boxes -->
    <rect x="160" y="42" width="55" height="26" rx="4" fill="#047857" />
    <text x="187" y="59" text-anchor="middle" font-family="monospace" font-size="15" font-weight="900" fill="#ffffff">'T'</text>

    <rect x="300" y="42" width="55" height="26" rx="4" fill="#047857" />
    <text x="327" y="59" text-anchor="middle" font-family="monospace" font-size="15" font-weight="900" fill="#ffffff">'W'</text>

    <rect x="440" y="42" width="55" height="26" rx="4" fill="#047857" />
    <text x="467" y="59" text-anchor="middle" font-family="monospace" font-size="15" font-weight="900" fill="#ffffff">'F'</text>

    <rect x="580" y="42" width="55" height="26" rx="4" fill="#047857" />
    <text x="607" y="59" text-anchor="middle" font-family="monospace" font-size="15" font-weight="900" fill="#ffffff">'u'</text>
  </g>

  <!-- Step 4: Padding & Overhead Note -->
  <g transform="translate(40, 350)">
    <rect width="720" height="78" rx="10" fill="#0f172a" stroke="#1e293b" />
    <rect x="16" y="14" width="90" height="24" rx="4" fill="#3b82f6" fill-opacity="0.2" />
    <text x="61" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">Padding Rules</text>
    <text x="120" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">1 Unmatched Byte = 2 Base64 Chars + "==" padding • 2 Unmatched Bytes = 3 Base64 Chars + "=" padding</text>
    
    <rect x="16" y="46" width="90" height="24" rx="4" fill="#f59e0b" fill-opacity="0.2" />
    <text x="61" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">33% Overhead</text>
    <text x="120" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Every 3 binary bytes expand into 4 ASCII bytes (4/3 = 133.3% size multiplier)</text>
  </g>
</svg>