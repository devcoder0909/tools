    <text x="16" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#475569">â€¢ Whitespace tokenizer</text>
    <text x="16" y="121" font-family="system-ui, sans-serif" font-size="12" fill="#475569">â€¢ Sentence &amp; clause regex</text>
    <text x="16" y="144" font-family="system-ui, sans-serif" font-size="12" fill="#475569">â€¢ Character matrix with/without spaces</text>
