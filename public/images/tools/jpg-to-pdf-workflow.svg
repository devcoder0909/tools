<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-jpg-to-pdf svg-desc-jpg-to-pdf">
  <title id="svg-title-jpg-to-pdf">JPG to PDF Converter Workflow &amp; Architecture Diagram</title>
  <desc id="svg-desc-jpg-to-pdf">Compiling individual JPEG photographs into an ISO 32000 compliant multi-page PDF document in browser RAM.</desc>
  <defs>
    <linearGradient id="bgGrad-jpg-to-pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow-jpg-to-pdf" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad-jpg-to-pdf)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="200" y="24" width="400" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" letter-spacing="0.5">
    CLIENT-SIDE PDF OBJECT STREAM PACKAGING
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    How JPG Images Compile Into Multi-Page PDF
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">
    ISO 32000-1 Architecture • XObject Stream Embedding • 100% Local Privacy
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 130)" filter="url(#shadow-jpg-to-pdf)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">1</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Select JPG Photos</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="105" text-anchor="middle" font-size="28">📑</text>
    <text x="105" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Single or Multi-Page</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Drop invoices, receipts, scans</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Reorder pages via drag</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Select A4 or Letter size</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Zero server uploads</text>
  </g>

  <!-- Flow 1 -->
  <g transform="translate(262, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(295, 130)" filter="url(#shadow-jpg-to-pdf)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#eff6ff" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#2563eb">2</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">WASM PDF Assembly</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="105" text-anchor="middle" font-size="28">⚙️</text>
    <text x="105" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">ISO 32000 Structure</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Embed DCTDecode streams</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Generate Catalog & XRef</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Set exact page margins</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#eff6ff" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">Pure in-memory compile</text>
  </g>

  <!-- Flow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#3b82f6" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 130)" filter="url(#shadow-jpg-to-pdf)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#fdf2f8" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#db2777">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Download Combined PDF</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="105" text-anchor="middle" font-size="28">📕</text>
    <text x="105" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Universal PDF Document</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Clean single file export</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Zero watermarks or ads</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Ready for official submission</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#fdf2f8" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#be185d">Universal compatibility</text>
  </g>

  <!-- Bottom Privacy Banner -->
  <g transform="translate(180, 400)">
    <rect width="440" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="20" cy="14" r="5" fill="#10b981" />
    <text x="35" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">
      100% In-Browser Private Execution • Ephemeral Device RAM • Zero Server Uploads
    </text>
  </g>
</svg>