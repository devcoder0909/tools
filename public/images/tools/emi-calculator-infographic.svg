<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="emiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="emiCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="emiShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#emiBg)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <rect x="270" y="24" width="260" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    LOAN AMORTIZATION MATRIX
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    How Loan EMI &amp; Reducing Balance Interest Work
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Principal Repayment vs Interest Component Shift Across 10, 20 &amp; 30 Year Tenures
  </text>

  <!-- Left: Loan Parameters -->
  <g transform="translate(40, 130)" filter="url(#emiShadow)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">1</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Loan Inputs</text>
    
    <rect x="20" y="65" width="170" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="30" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Principal Loan Amount</text>
    <text x="30" y="97" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">$100,000</text>

    <rect x="20" y="115" width="170" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="30" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Annual Interest Rate</text>
    <text x="30" y="147" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#059669">8.5% (Reducing)</text>

    <rect x="20" y="165" width="170" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="30" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Loan Tenure</text>
    <text x="30" y="197" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">20 Years (240 Mos)</text>

    <rect x="20" y="215" width="170" height="24" rx="4" fill="#ecfdf5" />
    <text x="105" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Instant In-Browser Math</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(262, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Middle: Amortization Breakdown -->
  <g transform="translate(295, 130)" filter="url(#emiShadow)">
    <rect width="210" height="250" rx="12" fill="url(#emiCard)" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#10b981" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#065f46">Monthly EMI Result</text>

    <rect x="20" y="65" width="170" height="50" rx="8" fill="#ffffff" stroke="#a7f3d0" />
    <text x="105" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#047857">Equated Monthly Payment</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#059669">$867.82 / mo</text>

    <!-- Visual Stack Bar -->
    <text x="25" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Payment Composition:</text>
    <rect x="25" y="145" width="160" height="18" rx="4" fill="#e2e8f0" />
    <rect x="25" y="145" width="78" height="18" rx="4" fill="#10b981" />
    <text x="64" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">48% Prin</text>
    <text x="142" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#475569">52% Int</text>

    <text x="25" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Principal: $100,000</text>
    <text x="25" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Total Interest: $108,277</text>
    <rect x="20" y="218" width="170" height="22" rx="4" fill="#059669" />
    <text x="105" y="233" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Total: $208,277 Paid</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right: Reducing Balance Timeline -->
  <g transform="translate(550, 130)" filter="url(#emiShadow)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tenure Dynamics</text>

    <text x="25" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Early Years (1 - 5):</text>
    <text x="25" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">• 75% of EMI goes to interest</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• Principal decreases slowly</text>

    <text x="25" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Later Years (15 - 20):</text>
    <text x="25" y="163" font-family="system-ui, sans-serif" font-size="10" fill="#059669">• 85% of EMI clears principal</text>
    <text x="25" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• Interest drops rapidly</text>

    <rect x="20" y="200" width="170" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="30" y="215" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f172a">💡 Prepayment Power:</text>
    <text x="30" y="230" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Paying 1 extra EMI/yr cuts tenure 4 yrs</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(180, 402)">
    <rect width="440" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="24" cy="16" r="8" fill="#10b981" />
    <path d="M20 16 L23 19 L28 13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">
      Standard Reducing Balance Formula: E = P × r × (1+r)^n / ((1+r)^n - 1)
    </text>
  </g>
</svg>
