<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-labelledby="svg-title-heic-to-jpg-workflow-svg svg-desc-heic-to-jpg-workflow-svg">
  <title id="svg-title-heic-to-jpg-workflow-svg">Heic To Jpg Client-Side Architecture & Process Flow Diagram</title>
  <desc id="svg-desc-heic-to-jpg-workflow-svg">Technical flowchart illustrating the 100% in-browser RAM conversion and processing pipeline for Heic To Jpg.</desc>
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="primaryCard4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad4)" stroke="#e2e8f0" stroke-width="2" />

  <rect x="280" y="24" width="240" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="400" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">
    CLIENT-SIDE WORKFLOW DIAGRAM
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    How Apple HEIC to JPG Conversion Works
  </text>
  <text x="400" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Convert iPhone &amp; iPad HEIC Photos to Universal JPEG • Zero Cloud Uploads
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 130)" filter="url(#shadow4)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">1</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Select iPhone HEIC</text>
    
    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4" />
    <text x="105" y="100" text-anchor="middle" font-size="24">📱</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Drop iPhone .heic photos</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Direct AirDrop or USB</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Batch 50+ photos at once</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Preserves 48MP resolution</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#ecfdf5" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Read into Local Browser RAM</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(262, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(295, 130)" filter="url(#shadow4)">
    <rect width="210" height="250" rx="12" fill="url(#primaryCard4)" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#10b981" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#065f46">HEIF Decoder</text>

    <rect x="25" y="65" width="160" height="80" rx="8" fill="#ffffff" stroke="#a7f3d0" />
    <text x="105" y="98" text-anchor="middle" font-size="22">⚡</text>
    <text x="105" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">High-Fidelity Re-encoding</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Unpack HEVC container</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Accurate color grading</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Zero loss of detail</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#059669" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">WASM In-Memory Parsing</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(517, 245)">
    <circle cx="15" cy="0" r="14" fill="#10b981" />
    <path d="M11 -4 L19 0 L11 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(550, 130)" filter="url(#shadow4)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#ecfdf5" />
    <text x="31" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#059669">3</text>
    <text x="58" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Download JPEG</text>

    <rect x="25" y="65" width="160" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="105" y="98" text-anchor="middle" font-size="24">💻</text>
    <text x="105" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Ready for Windows PC</text>

    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Opens in Windows Photos</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• No $0.99 codec needed</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Download All as ZIP</text>
    <rect x="25" y="222" width="160" height="20" rx="4" fill="#f1f5f9" />
    <text x="105" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">100% Private Offline</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(200, 402)">
    <rect width="400" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="24" cy="16" r="8" fill="#10b981" />
    <path d="M20 16 L23 19 L28 13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">
      No Windows Store codec required: Convert iPhone HEIC to JPG instantly
    </text>
  </g>
</svg>
