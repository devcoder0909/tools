  content: src/content/tools/heic-to-jpg.mdx
  faq:
    - q: Why won't my iPhone photos open on Windows?
      a: Windows requires codec extensions from the Microsoft Store. The HEIF Image Extension is free, but the HEVC Video Extension is a paid download ($0.99). Converting your photos to universal JPG avoids needing either extension.
    - q: Does converting reduce quality?
      a: HEIC is already a lossy format. JPG recompresses the pixels, meaning a small amount of fine detail is technically lost. However, at our default 85% to 95% quality setting, optical differences are imperceptible to the human eye.
    - q: Are my photos uploaded to any external server?
      a: No. Files are decoded in your browser memory and converted locally. You can verify this independently at any moment by inspecting the Network tab in your browser Developer Tools.
    - q: Do Live Photos keep their motion?
      a: No. Converting an HEIC container extracts only the primary still image frame as a standard JPG. Live Photo video motion is stored in a companion .mov video file.
    - q: How do I stop my iPhone saving HEIC?
      a: Go to Settings > Camera > Formats and select "Most Compatible". New photos will automatically be saved as standard JPEG files. Previously captured photos will remain in HEIC format.
    - q: Are JPG and JPEG the same?
      a: Yes. Both extensions represent the identical file format. The three-letter .jpg extension exists solely because early MS-DOS operating systems required three-letter file extensions.
    - q: Will metadata like location and date stay?
      a: Standard EXIF metadata such as camera model, exposure, and date are preserved during conversion. You can also toggle the strip-metadata option to purge GPS location data for privacy before sharing.
    - q: Can I convert HEIF files?
      a: Yes. Our engine accepts both .heic and .heif file extensions, as well as multi-image bursts captured by iOS devices.
    - q: Will the JPG be smaller than my HEIC?
      a: Converted JPGs are typically 25% to 40% larger than original HEIC files. HEIC uses modern H.265 compression, so older JPEG encoding requires more bytes to represent identical optical detail.
    - q: Is there a file limit or conversion cap?
      a: No arbitrary file size caps or session limits exist. Processing is limited only by your local device memory (RAM). You can batch convert dozens of photos simultaneously.
    - q: Why does my iPhone use HEIC?
      a: Apple introduced HEIC in iOS 11 (2017) to cut photo storage consumption in half while supporting 16-bit wide-gamut Display P3 colors.
    - q: How do I open HEIC on Mac or Android?
      a: Apple macOS opens HEIC natively in Preview and Finder. Recent Android versions (Android 9+) support HEIC viewing in Google Photos, though third-party messaging apps frequently require JPG.
