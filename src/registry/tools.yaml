  content: src/content/tools/percentage-calculator.mdx
  faq:
    - q: How do I calculate the percentage of a number?
      a: Multiply the base number by the percentage rate divided by 100. For example, to find 20% of 150, compute (20 ÷ 100) × 150 = 30.
    - q: What is the percentage change formula?
      a: Subtract the initial value from the final value, divide by the absolute initial value, and multiply by 100 (((New − Old) ÷ |Old|) × 100).
    - q: How do I calculate a retail discount or sales markdown?
      a: Multiply original price by (1 - discount% ÷ 100). For example, a $120 jacket at 15% off costs $120 × 0.85 = $102, saving $18.
    - q: How do I find what percentage one number is of another?
      a: Divide the part by the total whole and multiply by 100 ((Part ÷ Whole) × 100). For example, 45 out of 180 is (45 ÷ 180) × 100 = 25%.
    - q: Can percentage change be negative?
      a: Yes. A negative result indicates a percentage decrease (e.g. price drop or weight loss), while positive indicates growth.
    - q: Does this calculator send my numbers to a server?
      a: No. All percentage calculations execute in real time using local client-side JavaScript. Your inputs remain 100% private.
